# Publishes the prebuilt site/ folder to GitHub Pages on every push to main.
# The pipeline itself runs locally (it needs AWS Bedrock and a GPU); build with
#   ./run_all.sh --hosted
# then commit site/ and push. Enable Pages with "Source: GitHub Actions" in the repo settings.
name: Deploy map to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
